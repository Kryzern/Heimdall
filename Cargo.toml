[workspace]
resolver = "2"
members = [
    "crates/heimdall-core",
    "crates/heimdall-common",
    "crates/heimdall-indexer",
    "crates/heimdall",
    "crates/heimdall-bench",
    "crates/heimdall-mac",
]
# The macOS front end only builds on a Mac (CI does that); leave it out of
# plain `cargo build` on Windows.
default-members = [
    "crates/heimdall-core",
    "crates/heimdall-common",
    "crates/heimdall-indexer",
    "crates/heimdall",
    "crates/heimdall-bench",
]

[workspace.package]
version = "1.0.4"
edition = "2021"
license = "MIT"
authors = ["Ethan Dsouza (Kryzern)"]

[workspace.dependencies]
heimdall-core = { path = "crates/heimdall-core" }
heimdall-common = { path = "crates/heimdall-common" }
memchr = "2.8"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
windows-sys = "0.59"
windows = "0.61"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
