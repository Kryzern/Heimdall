<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2030"/>
      <stop offset="1" stop-color="#08090e"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#2c3244"/>
      <stop offset="1" stop-color="#11131b"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f9"/>
      <stop offset="0.55" stop-color="#9aa0ac"/>
      <stop offset="1" stop-color="#dfe2e8"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7d838f"/>
      <stop offset="0.5" stop-color="#eef0f3"/>
      <stop offset="1" stop-color="#8b919c"/>
    </linearGradient>
    <clipPath id="inside"><circle cx="226" cy="226" r="118"/></clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- handle sits under the rim -->
  <line x1="330" y1="330" x2="400" y2="400" stroke="url(#grip)" stroke-width="40" stroke-linecap="round"/>

  <!-- lens -->
  <circle cx="226" cy="226" r="128" fill="url(#glass)"/>
  <g clip-path="url(#inside)" fill="none" stroke-width="15" opacity="0.95">
    <circle cx="226" cy="430" r="200" stroke="#ff6464"/>
    <circle cx="226" cy="430" r="186" stroke="#ffa65c"/>
    <circle cx="226" cy="430" r="172" stroke="#ffe066"/>
    <circle cx="226" cy="430" r="158" stroke="#5ce6a0"/>
    <circle cx="226" cy="430" r="144" stroke="#5caeff"/>
    <circle cx="226" cy="430" r="130" stroke="#a582ff"/>
  </g>
  <path d="M136 196 A96 96 0 0 1 196 136" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- rim -->
  <circle cx="226" cy="226" r="128" fill="none" stroke="url(#metal)" stroke-width="22"/>
</svg>
