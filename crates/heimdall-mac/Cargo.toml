[package]
name = "heimdall-mac"
description = "Heimdall for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "heimdall-mac"
path = "src/main.rs"

[features]
# Turn Objective-C exceptions into readable panics (logged to heimdall.log).
# Needs a C compiler for the target, so CI builds with it and local cross
# checks from Windows don't.
objc-exceptions = ["objc2/catch-all"]

[dependencies]
heimdall-core.workspace = true
heimdall-common.workspace = true
rayon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
libc = "0.2"
